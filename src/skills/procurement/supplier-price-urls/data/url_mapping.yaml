# 采购物料询价网址映射表（利环康实验设备 · 实验台/通风柜材料）
# 格式: 物料名称 → 询价站点/商家 → 询价页面URL
#
# URL 指向的页面包含完整产品信息:
#   - 价格（当前售价、行情价、历史价格）
#   - 规格、单位、品牌、材质等基本信息
#   - 爬虫技能可从页面提取上述全部数据
#
# 字段说明（结构固定，加载器按这三个键读取）:
#   part_name  物料名称（含规格/品牌描述），与 ERP material_query 返回的 name+spec 对齐
#   supplier   询价站点或商家名称；公开 B2B 平台写平台名（多供应商）
#   url        询价/价格页面地址（必须真实可访问）
#
# 使用流程:
#   1. MCP 工具获取 ERP 数据（material_query 的物料名、supplier_query 的供应商名）
#   2. 在本文件中按 物料名 查找对应询价 URL（分类见各段注释）
#   3. 找到 URL → 爬虫技能获取最新报价 + 产品详情
#   4. 未找到 URL → web_search 搜索市场价格
#
# 维护要求: 新增条目只填真实存在、可访问的站点域名，禁止填写占位域名或内网演示地址。

