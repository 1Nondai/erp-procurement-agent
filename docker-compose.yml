# ============================================================
# 明远实验装备 · 一键编排（开发/演示环境）
# ------------------------------------------------------------
# 覆盖无状态依赖：PostgreSQL —— 同一个库承担两类数据，靠 schema 隔离：
#   - erp.*         业务数据（供应商/物料/报价/订单/库存），由 db/init/*.sql 初始化
#   - 默认 schema   LangGraph 的 checkpoint / store / 展示消息（由代码 setup() 建表）
#
# 不放进编排的组件与原因：
#   - Agent 后端 / 前端：需要 .env 里的模型 Key 与本地代码热更新，跑 start_web.py 更顺手；
#   - MCP Server：同上，且它需要直连数据库（见 ERP_DB_URI）；
#   - OpenSandbox Server：由 Docker Desktop 单独运行（opensandbox-server 镜像），与本编排解耦。
#
# 使用：
#   docker compose up -d          # 启动 PostgreSQL，首次启动自动灌入业务库与演示数据
#   docker compose ps
#   docker compose logs postgres
#   docker compose down           # 加 -v 连数据卷一起删（删了才会重新执行 db/init）
#
# 注意：db/init/*.sql 只在数据卷为空时执行一次。
# 要重建业务数据：docker compose down -v && docker compose up -d
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: lhk_erp_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # 本地开发默认 postgres/postgres，开箱即用；生产环境必须用 POSTGRES_PASSWORD 覆盖。
      # 端口只绑 127.0.0.1，弱口令不会被公网直接利用——但这不构成"可以不改"的理由。
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-langgraph_db}
    ports:
      # 只绑定回环地址：数据库不对外网暴露，需要远程访问请走 SSH 隧道
      - "127.0.0.1:5432:5432"
    volumes:
      # 数据持久化：容器重建不丢 checkpoint、用户记忆与业务数据
      - lhk_pgdata:/var/lib/postgresql/data
      # 初始化脚本：01 建表/视图 → 02 演示数据（按文件名字典序执行）
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-langgraph_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lhk_pgdata:
