name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # 后端：语法编译 + 静态检查 + 纯标准库单元测试
  # 这三步不需要安装 langchain / psycopg 等重依赖，几十秒能跑完，
  # 适合作为每次 push 的第一道门禁。
  # ------------------------------------------------------------
  backend:
    name: 后端检查（compile / lint / unittest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法编译
        run: python -m compileall -q src tests start_web.py

      - name: 静态检查（ruff）
        run: |
          python -m pip install --quiet ruff==0.17.3
          python -m ruff check src tests scripts start_web.py

      - name: 单元测试（身份校验 / 订单幂等 / 评测集与知识库一致性）
        run: |
          # 评测集一致性测试需要解析 YAML；其余测试都是纯标准库
          python -m pip install --quiet pyyaml
          python -m unittest discover -s tests -v

  # ------------------------------------------------------------
  # 前端：依赖安装 + 生产构建（构建失败 = 不能发版）
  # ------------------------------------------------------------
  frontend:
    name: 前端构建（npm ci / vite build）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 生产构建
        run: npm run build

  # ------------------------------------------------------------
  # 业务库：起一个真 PostgreSQL，跑 db/init 与 repository 自检
  # 这一层最容易"看起来写了其实没跑"，所以放 CI 里当作数据层的回归。
  # ------------------------------------------------------------
  database:
    name: 业务库（schema / seed / repository）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: langgraph_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 初始化业务库（schema + 演示数据）
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d langgraph_db -v ON_ERROR_STOP=1 -q -f db/init/01_schema.sql
          psql -h localhost -U postgres -d langgraph_db -v ON_ERROR_STOP=1 -q -f db/init/02_seed.sql

      - name: 安装驱动
        run: python -m pip install --quiet "psycopg[binary,pool]"

      - name: 数据层自检（30+ 断言）
        env:
          ERP_DB_URI: postgresql://postgres:postgres@localhost:5432/langgraph_db
        run: python scripts/smoke_db.py
